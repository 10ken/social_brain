name: SocialBrain

options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "26.3"
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug-Local
  createIntermediateGroups: true
  groupOrdering:
    - order: [SocialBrain, SocialBrainTests, SocialBrainUITests, Config, TestPlans, Scripts]

configs:
  Debug-Local: debug
  Debug-Firebase: debug
  Release-Local: release
  Release-Firebase: release

configFiles:
  Debug-Local: Config/Debug-Local.xcconfig
  Debug-Firebase: Config/Debug-Firebase.xcconfig
  Release-Local: Config/Release-Local.xcconfig
  Release-Firebase: Config/Release-Firebase.xcconfig

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.17.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.1.0

fileGroups:
  - Config
  - Scripts
  - TestPlans
  - SocialBrain/Resources/Info.plist
  - SocialBrain/Resources/SocialBrain.entitlements
  - SocialBrain/Resources/GoogleService-Info.plist.example

targets:
  SocialBrain:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SocialBrain/App
        buildPhase: sources
      - path: SocialBrain/Models
        buildPhase: sources
      - path: SocialBrain/Services
        buildPhase: sources
      - path: SocialBrain/Views
        buildPhase: sources
      - path: SocialBrain/Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - SocialBrain.entitlements
          - GoogleService-Info.plist
          - GoogleService-Info.plist.example
    postBuildScripts:
      - name: Embed Firebase service configuration
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(FIREBASE_PLIST_PATH)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
        script: |
          set -euo pipefail
          if [[ "${SOCIAL_BRAIN_REQUIRE_FIREBASE_CONFIG:-NO}" != "YES" ]]; then
            exit 0
          fi

          if [[ -z "${FIREBASE_PLIST_PATH:-}" || ! -f "$FIREBASE_PLIST_PATH" ]]; then
            echo "error: Firebase configuration is required for this build"
            exit 1
          fi

          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          /bin/mkdir -p "$(dirname "$destination")"
          /bin/cp "$FIREBASE_PLIST_PATH" "$destination"
    settings:
      base:
        PRODUCT_NAME: Social Brain
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SocialBrain/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SocialBrain/Resources/SocialBrain.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: $(SOCIAL_BRAIN_DEVELOPMENT_TEAM)
      configs:
        Debug-Local:
          PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.socialbrain.local
        Release-Local:
          PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.socialbrain.local
        Debug-Firebase:
          PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.socialbrain
        Release-Firebase:
          PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.socialbrain
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn

  SocialBrainTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SocialBrainTests
        buildPhase: sources
      - path: ../shared/contracts/v1/fixtures/ai-extraction.valid.json
        name: ai-extraction.valid.json
        group: Shared Contracts
        buildPhase: resources
      - path: ../shared/contracts/v1/fixtures/ai-extraction.invalid.json
        name: ai-extraction.invalid.json
        group: Shared Contracts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.socialbrain.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: SocialBrain

  SocialBrainUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SocialBrainUITests
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.socialbrain.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: SocialBrain

schemes:
  SocialBrain-Local:
    shared: true
    build:
      targets:
        SocialBrain: all
        SocialBrainTests: [test]
        SocialBrainUITests: [test]
    run:
      config: Debug-Local
      executable: SocialBrain
      environmentVariables:
        SOCIAL_BRAIN_RUNTIME: local
    test:
      config: Debug-Local
      gatherCoverageData: true
      coverageTargets:
        - SocialBrain
      targets:
        - name: SocialBrainTests
          parallelizable: true
        - name: SocialBrainUITests
          parallelizable: false
      testPlans:
        - path: TestPlans/Local.xctestplan
          defaultPlan: true
    analyze:
      config: Debug-Local
    profile:
      config: Release-Local
    archive:
      config: Release-Local

  SocialBrain-FirebaseDebug:
    shared: true
    build:
      targets:
        SocialBrain: all
        SocialBrainTests: [test]
        SocialBrainUITests: [test]
    run:
      config: Debug-Firebase
      executable: SocialBrain
      environmentVariables:
        SOCIAL_BRAIN_RUNTIME: firebase
    test:
      config: Debug-Firebase
      gatherCoverageData: true
      coverageTargets:
        - SocialBrain
      targets:
        - name: SocialBrainTests
          parallelizable: true
        - name: SocialBrainUITests
          parallelizable: false
      testPlans:
        - path: TestPlans/Firebase.xctestplan
          defaultPlan: true
    analyze:
      config: Debug-Firebase
    profile:
      config: Release-Firebase
    archive:
      config: Release-Firebase

  SocialBrain-Release:
    shared: true
    build:
      targets:
        SocialBrain: all
    run:
      config: Release-Firebase
      executable: SocialBrain
      environmentVariables:
        SOCIAL_BRAIN_RUNTIME: firebase
    analyze:
      config: Release-Firebase
    profile:
      config: Release-Firebase
    archive:
      config: Release-Firebase

  SocialBrain-UITests:
    shared: true
    build:
      targets:
        SocialBrain: all
        SocialBrainUITests: [test]
    run:
      config: Debug-Local
      executable: SocialBrain
      environmentVariables:
        SOCIAL_BRAIN_RUNTIME: local
        SOCIAL_BRAIN_UI_TESTING: "YES"
        SOCIAL_BRAIN_USE_IN_MEMORY_STORE: "YES"
    test:
      config: Debug-Local
      gatherCoverageData: true
      coverageTargets:
        - SocialBrain
      targets:
        - name: SocialBrainUITests
          parallelizable: false
      testPlans:
        - path: TestPlans/UITests.xctestplan
          defaultPlan: true
    analyze:
      config: Debug-Local
    profile:
      config: Release-Local
