name: SocialBrain
options:
  minimumXcodeGenVersion: 2.38.0
configs:
  Debug: debug
  Release: release
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0
targets:
  SocialBrain:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SocialBrain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.socialbrain
        PRODUCT_NAME: Social Brain
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SocialBrain/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SocialBrain/Resources/SocialBrain.entitlements
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
  SocialBrainTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SocialBrainTests
    dependencies:
      - target: SocialBrain
